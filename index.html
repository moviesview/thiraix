<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="thiraiX - Tamil TV Shows & Serials" />
  <title>thiraiX | Tamil TV Shows & Serials</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="siteLoader" class="site-loader" role="status" aria-live="polite">
    <div class="site-loader-inner">
      <img src="assets/thiraix-logo.png" alt="thiraiX" />
      <div class="loader-spinner" aria-hidden="true"></div>
      <span>Loading thiraiX...</span>
    </div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="thiraiX home">
        <img src="assets/thiraix-logo.png" alt="thiraiX" />
      </a>
      <button id="searchToggle" class="icon-button" type="button" aria-label="Search videos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      </button>
    </header>

    <div id="searchBar" class="searchbar hidden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      <input id="searchInput" type="search" placeholder="Search serials, shows or episodes" autocomplete="off" />
      <button id="searchClose" type="button" aria-label="Close search">×</button>
    </div>

    <nav class="category-bar" aria-label="Video categories">
      <button class="category active" type="button" data-type="Serial">Serials</button>
      <button class="category" type="button" data-type="Show">Shows</button>
      <button id="filterToggle" class="filter-button" type="button" aria-label="Filter by date">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>
        <span>Filter</span>
        <span id="filterDot" class="filter-dot hidden"></span>
      </button>
    </nav>

    <main>
      <section class="content-head">
        <div>
          <p id="sectionEyebrow">SERIALS</p>
          <h1 id="sectionTitle">Latest Serials</h1>
        </div>
        <span id="resultCount" class="result-count">0 videos</span>
      </section>

      <section id="videoGrid" class="video-grid" aria-live="polite"></section>

      <section id="emptyState" class="empty-state hidden">
        <div class="empty-icon">▶</div>
        <h2>No videos found</h2>
        <p>Try another date, category or search.</p>
        <button id="clearFilters" type="button">Clear filters</button>
      </section>
    </main>
  </div>

  <div id="filterSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
    <button class="sheet-backdrop" type="button" data-close-sheet aria-label="Close filter"></button>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <div>
          <p>FILTER</p>
          <h2 id="filterTitle">Filter by date</h2>
        </div>
        <button class="sheet-close" type="button" data-close-sheet aria-label="Close">×</button>
      </div>

      <div class="quick-dates">
        <button type="button" data-range="today">Today</button>
        <button type="button" data-range="7">Last 7 days</button>
        <button type="button" data-range="30">Last 30 days</button>
      </div>

      <label class="date-field">
        <span>From</span>
        <input id="dateFrom" type="date" />
      </label>
      <label class="date-field">
        <span>To</span>
        <input id="dateTo" type="date" />
      </label>

      <div class="sheet-actions">
        <button id="resetDate" class="button secondary" type="button">Reset</button>
        <button id="applyDate" class="button primary" type="button">Apply filter</button>
      </div>
    </div>
  </div>

  <div id="playerModal" class="player-modal hidden" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
    <div class="player-page">
      <header class="player-header">
        <button id="playerClose" class="player-back" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="player-heading">
          <strong id="playerTitle">Video</strong>
          <span id="playerMeta"></span>
        </div>
        <button id="shareVideo" class="player-share" type="button" aria-label="Share video" title="Share video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a3 3 0 1 0-2.83-4A3 3 0 0 0 15 5c0 .2.02.39.06.58L8.91 9.12A3 3 0 0 0 7 8.5a3 3 0 1 0 1.91 5.38l6.15 3.54A3 3 0 0 0 15 18c0 .35.06.69.17 1A3 3 0 1 0 17 15.18l-6.18-3.56c.04-.2.06-.41.06-.62s-.02-.42-.06-.62L17 6.82c.3.12.64.18 1 .18Z"/></svg>
        </button>
      </header>

      <div id="videoStage" class="video-stage">
        <video id="videoPlayer" playsinline preload="metadata"></video>

        <div id="videoLoader" class="video-loader hidden" role="status" aria-live="polite">
          <div class="video-loader-spinner" aria-hidden="true"></div>
          <span>Loading video...</span>
        </div>

        <div id="gestureLayer" class="gesture-layer" aria-hidden="true">
          <div class="gesture-zone gesture-left"><span id="gestureBackFeedback" class="gesture-feedback">↶ 10s</span></div>
          <div class="gesture-zone gesture-center"><span id="gestureCenterFeedback" class="gesture-feedback">▶</span></div>
          <div class="gesture-zone gesture-right"><span id="gestureForwardFeedback" class="gesture-feedback">10s ↷</span></div>
        </div>

        <button id="bigPlay" class="big-play" type="button" aria-label="Play or pause">▶</button>

        <div id="playerControls" class="custom-controls">
          <input id="seekBar" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek video" />
          <div class="controls-row">
            <button id="back10" type="button" aria-label="Back 10 seconds">↶<small>10</small></button>
            <button id="playPause" class="control-play" type="button" aria-label="Play">▶</button>
            <button id="forward10" type="button" aria-label="Forward 10 seconds">↷<small>10</small></button>
            <span id="timeText" class="time-text">0:00 / 0:00</span>
            <button id="volumeDown" type="button" aria-label="Decrease volume">−</button>
            <button id="muteToggle" type="button" aria-label="Mute">🔊</button>
            <button id="volumeUp" type="button" aria-label="Increase volume">+</button>
            <button id="fullscreenToggle" type="button" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
            </button>
          </div>
        </div>
      </div>

      <section class="now-playing">
        <span id="playerBadge" class="now-badge">Serial</span>
        <h2 id="playerDisplayTitle"></h2>
        <p id="playerDescription"></p>
      </section>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
